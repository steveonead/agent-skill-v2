<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- SPEC:TITLE feature 名稱 --> — <!-- SPEC:PRODUCT 產品或系統名稱 --></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand color. OneAD blue, oklch(58.496% .14075 252.248) = #337ECC.
     To rebrand, change only these four values plus the mermaid `theme.accent`
     in the render script near the bottom of this file. Everything else derives
     from them. Keep the four in one hue family: brand, a darker version for
     hover and link text, a lighter version for hairlines, and a tint for
     backgrounds. */
  --brand:#337ECC;
  --brand-deep:#245A93;
  --brand-soft:#7FAEDD;
  --brand-bg:#E8F0FA;

  --paper:#F4F7FA;
  --surface:#FFFFFF;
  --sunken:#EEF3F8;
  --ink:#15202C;
  --ink-2:#3E5266;
  --ink-3:#63768A;
  --line:#DBE4ED;
  --line-2:#BFCEDC;

  --green:#33745A;
  --green-bg:#E6F1EB;
  --amber:#8A6524;
  --amber-bg:#F7F0E1;
  --red:#9E4A46;
  --red-bg:#F8EAE9;

  --serif:"Newsreader","Noto Serif TC",Georgia,serif;
  --sans:"Inter","Noto Sans TC",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --rail:188px;
  --gap:52px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  font-weight:450;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
code,pre,.mono{font-family:var(--mono)}
strong{font-weight:650}

/* ---------- shell ---------- */
.shell{
  max-width:1440px;
  margin:0 auto;
  padding:0 40px 140px;
  display:grid;
  grid-template-columns:var(--rail) minmax(0,1fr);
  gap:var(--gap);
  align-items:start;
}

/* ---------- left rail ---------- */
.rail{position:sticky;top:0;padding:72px 0 0}
.rail-mark{
  font-family:var(--mono);
  font-size:16px;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--brand-deep);
  padding-bottom:16px;
  border-bottom:2px solid var(--line-2);
  margin-bottom:20px;
}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{
  text-decoration:none;
  color:var(--ink-2);
  font-size:16px;
  font-weight:500;
  padding:7px 0 7px 16px;
  border-left:3px solid transparent;
  transition:color .2s,border-color .2s;
}
.rail nav a:hover{color:var(--ink)}
.rail nav a.on{color:var(--brand-deep);border-left-color:var(--brand);font-weight:650}
.rail nav a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
.rail-foot{
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:8px;
  font-family:var(--mono);
  font-size:16px;
  color:var(--ink-3);
}
.rail-foot a{color:var(--brand-deep);text-decoration:none;font-weight:500}
.rail-foot a:hover{text-decoration:underline}

/* ---------- masthead ---------- */
.masthead{padding:72px 0 0}
.eyebrow{
  font-family:var(--mono);
  font-size:16px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--brand);
}
.masthead h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(42px,6vw,64px);
  line-height:1.1;
  letter-spacing:-.015em;
  margin:16px 0 0;
}
.lede{
  font-family:var(--serif);
  font-size:22px;
  font-weight:500;
  line-height:1.65;
  color:var(--ink-2);
  max-width:42em;
  margin:20px 0 0;
}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.tag{
  font-family:var(--mono);
  font-size:16px;
  font-weight:500;
  padding:4px 14px;
  border:1.5px solid var(--line-2);
  border-radius:999px;
  color:var(--ink-2);
}
.tag.draft{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
a.tag{text-decoration:none;color:var(--brand-deep);border-color:var(--brand-soft)}
a.tag:hover{background:var(--brand-bg)}

/* ---------- sections ---------- */
section{padding-top:92px}
.sec-head{
  display:flex;
  align-items:baseline;
  gap:16px;
  padding-bottom:14px;
  border-bottom:2px solid var(--line-2);
  margin-bottom:36px;
}
.sec-head h2{
  font-family:var(--serif);
  font-weight:600;
  font-size:32px;
  letter-spacing:-.01em;
  margin:0;
}
.sec-head .eyebrow{margin-left:auto;color:var(--ink-3)}
h3{
  font-family:var(--serif);
  font-weight:600;
  font-size:23px;
  margin:52px 0 16px;
}
h4{
  font-family:var(--mono);
  font-size:16px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
  margin:26px 0 12px;
}
p{margin:0 0 16px;max-width:44em}
.muted{color:var(--ink-2)}

/* ---------- note ---------- */
.note{
  display:flex;
  gap:16px;
  padding:18px 22px;
  border-radius:6px;
  background:var(--brand-bg);
  border-left:4px solid var(--brand);
  line-height:1.75;
  color:var(--ink-2);
}
.note p{margin:0}
.note .label{
  font-family:var(--mono);
  font-size:16px;
  font-weight:600;
  letter-spacing:.08em;
  color:var(--brand-deep);
  flex:0 0 auto;
}
.note.proposal{background:var(--amber-bg);border-left-color:var(--amber)}
.note.proposal .label{color:var(--amber)}

/* ---------- goals ---------- */
.split{display:flex;flex-direction:column;gap:20px;margin-top:36px}
.panel{
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.panel-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 22px;
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.panel-head .sign{
  width:24px;height:24px;
  border-radius:6px;
  display:grid;place-items:center;
  font-size:17px;
  line-height:1;
}
.panel.goals .panel-head{background:var(--brand);color:#fff}
.panel.goals .sign{background:rgba(255,255,255,.22);color:#fff}
.panel.nongoals .panel-head{background:var(--ink-2);color:#fff}
.panel.nongoals .sign{background:rgba(255,255,255,.2);color:#fff}
.panel ul{margin:0;padding:6px 22px 18px;list-style:none;max-width:none}
.panel li{
  position:relative;
  padding:12px 0 12px 24px;
  border-bottom:1px solid var(--line);
  line-height:1.7;
}
.panel li:last-child{border-bottom:0}
.panel li::before{
  position:absolute;left:0;top:12px;
  font-family:var(--mono);
  font-weight:700;
}
.panel.goals li::before{content:"✓";color:var(--brand)}
.panel.nongoals li::before{content:"✕";color:var(--ink-3)}
.panel.nongoals li{color:var(--ink-2)}

/* ---------- user stories ---------- */
.stories{display:flex;flex-direction:column;gap:26px}
.story{
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.story-head{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 24px;
  background:var(--sunken);
  border-bottom:1.5px solid var(--line);
}
.story-id{
  font-family:var(--mono);
  font-weight:700;
  color:#fff;
  background:var(--brand);
  border-radius:5px;
  padding:2px 11px;
}
.story-title{
  font-family:var(--serif);
  font-size:21px;
  font-weight:600;
  margin:0;
}
.story-count{
  margin-left:auto;
  font-family:var(--mono);
  color:var(--ink-3);
  white-space:nowrap;
}
.story-role{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:8px 18px;
  margin:0;
  padding:20px 24px;
  border-bottom:1.5px solid var(--line);
}
.story-role dt{
  font-family:var(--mono);
  font-weight:600;
  color:var(--brand-deep);
  white-space:nowrap;
}
.story-role dd{margin:0;color:var(--ink-2)}

.story .diagram{
  margin:0;
  border:0;
  border-radius:0;
  border-bottom:1.5px solid var(--line);
  max-height:none;
}
.ac-text{border-top:0}
.ac-text summary{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 24px;
  cursor:pointer;
  list-style:none;
  font-family:var(--mono);
  font-weight:600;
  color:var(--ink-3);
  transition:color .18s,background .18s;
}
.ac-text summary::-webkit-details-marker{display:none}
.ac-text summary:hover{color:var(--brand-deep);background:var(--sunken)}
.ac-text summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.ac-text[open] summary{border-bottom:1px solid var(--line)}
.ac-list{padding:6px 24px 22px;animation:reveal .24s ease both}
.ac-legend,.ac{
  display:grid;
  grid-template-columns:78px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr);
  gap:0 12px;
}
.ac-legend{
  padding:14px 0 10px;
  font-family:var(--mono);
  font-weight:600;
  letter-spacing:.06em;
  color:var(--ink-3);
}
.ac-legend span{padding-left:14px}
.ac{align-items:stretch;padding:7px 0;border-top:1px solid var(--line)}
.ac-id{
  font-family:var(--mono);
  color:var(--ink-3);
  padding-top:13px;
}
.beat{padding:12px 14px;border-radius:6px;line-height:1.65}
.beat.given{background:var(--sunken);color:var(--ink-2)}
.beat.when{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink);font-weight:500}
.beat.then{background:var(--brand-bg);color:var(--brand-deep);font-weight:500}
.beat::before{display:none}
.arrow{display:grid;place-items:center}
.arrow::before{
  content:"";
  width:9px;height:9px;
  border-top:2px solid var(--brand-soft);
  border-right:2px solid var(--brand-soft);
  transform:rotate(45deg);
}

/* ---------- inline code ---------- */
p code,li code,td code,summary code,.msg code{
  font-size:.92em;
  font-weight:500;
  background:var(--sunken);
  border:1px solid var(--line);
  border-radius:4px;
  padding:1px 6px;
  color:var(--brand-deep);
}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:16px}
th{
  text-align:left;
  font-family:var(--mono);
  font-size:16px;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--ink-3);
  padding:0 18px 12px 0;
  border-bottom:2px solid var(--line-2);
  white-space:nowrap;
}
td{
  padding:14px 18px 14px 0;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  line-height:1.7;
  color:var(--ink-2);
}
td:first-child{color:var(--ink);font-weight:500}
th:last-child,td:last-child{padding-right:0}

/* ---------- diagram ---------- */
.diagram{
  margin-top:16px;
  padding:24px;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:8px;
  max-height:100dvh;
  overflow:auto;
  cursor:grab;
  overscroll-behavior:contain;
}
.diagram.dragging{cursor:grabbing;user-select:none}
.diagram svg{display:block;margin:0 auto}
.diagram::-webkit-scrollbar{width:10px;height:10px}
.diagram::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
.diagram::-webkit-scrollbar-track{background:transparent}
.diagram-cap{
  font-size:16px;
  color:var(--ink-3);
  margin:10px 0 0;
}

/* ---------- API ledger ---------- */
.ledger{border-top:2px solid var(--line-2)}
.group-label{
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--brand-deep);
  padding:30px 0 10px;
}
.ledger details{border-bottom:1px solid var(--line)}
.ledger details[open]{background:var(--surface)}
.ledger summary{
  display:grid;
  grid-template-columns:78px minmax(0,1fr) auto 16px;
  align-items:center;
  gap:18px;
  padding:16px 8px;
  cursor:pointer;
  list-style:none;
  transition:background .18s;
}
.ledger summary::-webkit-details-marker{display:none}
.ledger summary:hover{background:var(--sunken)}
.ledger summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:4px}
.verb{
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:center;
  padding:2px 0;
  border-radius:5px;
  color:#fff;
}
.verb.get{background:var(--green)}
.verb.post{background:var(--brand)}
.verb.fn{background:var(--ink-2);font-size:15px}
.path{
  font-family:var(--mono);
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.auth{font-size:16px;color:var(--ink-3);white-space:nowrap}
.chev{
  width:9px;height:9px;
  border-right:2px solid var(--ink-3);
  border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .2s;
}
details[open] .chev{transform:rotate(-135deg) translate(-2px,-2px);border-color:var(--brand)}
.acc-body{
  padding:4px 8px 34px;
  animation:reveal .24s ease both;
}
.acc-body p{max-width:none}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}}
.acc-body > p:first-child{color:var(--ink-2)}

/* ---------- code ---------- */
pre{
  margin:0;
  padding:18px 20px;
  background:var(--sunken);
  border:1.5px solid var(--line);
  border-radius:6px;
  overflow-x:auto;
  font-size:16px;
  line-height:1.7;
  tab-size:2;
}
pre code{font-family:var(--mono);font-weight:500}

/* ---------- wireframe ---------- */
.wf-nav{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  padding:5px;
  background:var(--sunken);
  border:1.5px solid var(--line);
  border-radius:8px;
  margin-bottom:20px;
}
.wf-nav button{
  font-family:var(--sans);
  font-size:16px;
  font-weight:550;
  color:var(--ink-2);
  background:none;
  border:0;
  border-radius:5px;
  padding:7px 16px;
  cursor:pointer;
  transition:background .18s,color .18s;
}
.wf-nav button:hover{color:var(--ink)}
.wf-nav button.on{background:var(--surface);color:var(--brand-deep);box-shadow:0 1px 3px rgba(21,32,44,.12)}
.wf-nav button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

[data-screen]{display:none}
[data-screen].on{display:block}
[data-state-panel]{display:none}
[data-state-panel].on{display:block}

.states{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.states button{
  font-family:var(--mono);
  font-size:16px;
  font-weight:500;
  color:var(--ink-2);
  background:var(--surface);
  border:1.5px solid var(--line-2);
  border-radius:999px;
  padding:3px 14px;
  cursor:pointer;
  transition:.18s;
}
.states button:hover{border-color:var(--brand-soft)}
.states button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.states button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.browser{
  border:1.5px solid var(--line-2);
  border-radius:10px;
  overflow:hidden;
  background:var(--surface);
}
.browser-bar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 16px;
  background:var(--sunken);
  border-bottom:1.5px solid var(--line);
}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.url{
  flex:1;
  font-family:var(--mono);
  font-size:16px;
  color:var(--ink-3);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:5px;
  padding:3px 12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.screen-body{padding:36px 28px}
.pane{max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pane-title{
  font-family:var(--serif);
  font-size:22px;
  font-weight:600;
  text-align:center;
  margin:0 0 4px;
}
.field{
  border:1.5px solid var(--line-2);
  border-radius:6px;
  padding:10px 14px;
  color:var(--ink-3);
  background:var(--surface);
}
.btn{
  border-radius:6px;
  padding:10px 14px;
  font-size:16px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
  border:1.5px solid transparent;
  font-family:var(--sans);
  transition:.18s;
}
.btn.solid{background:var(--brand);color:#fff}
.btn.solid:hover{background:var(--brand-deep)}
.btn.line{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.line:hover{border-color:var(--brand);color:var(--brand-deep)}
.btn.quiet{background:none;color:var(--brand-deep);font-weight:550}
.btn.quiet:hover{text-decoration:underline}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.msg{
  line-height:1.7;
  padding:14px 16px;
  border-radius:6px;
  font-weight:500;
}
.msg.bad{background:var(--red-bg);color:var(--red)}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.warn{background:var(--amber-bg);color:var(--amber)}
.msg.info{background:var(--brand-bg);color:var(--brand-deep)}
.msg code{background:rgba(255,255,255,.7);border-color:transparent;color:inherit}
/* A data-goto that points at a missing screen gets flagged visually. */
.goto-unresolved{outline:2px dashed var(--red);outline-offset:2px}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding-bottom:18px;
  border-bottom:1.5px solid var(--line);
  margin-bottom:18px;
}
.topbar strong{font-family:var(--serif);font-size:21px;font-weight:600}
.notes{
  margin:20px 0 0;
  padding:0;
  list-style:none;
  counter-reset:n;
  color:var(--ink-2);
}
.notes li{
  counter-increment:n;
  padding:10px 0 10px 32px;
  position:relative;
  border-top:1px solid var(--line);
}
.notes li::before{
  content:counter(n);
  position:absolute;left:0;top:10px;
  font-family:var(--mono);
  font-weight:700;
  color:var(--brand);
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:0;padding:0 20px 100px}
  .rail{position:static;padding-top:36px;order:2}
  .rail nav{flex-direction:row;flex-wrap:wrap}
  .rail nav a{border-left:0;border-top:3px solid transparent;padding:6px 14px 6px 0}
  .rail nav a.on{border-left:0;border-top-color:var(--brand)}
  .masthead{padding-top:52px}
  .ledger summary{grid-template-columns:74px minmax(0,1fr) 16px;gap:14px}
  .story-head{flex-wrap:wrap;gap:10px}
  .story-count{margin-left:0;flex-basis:100%}
  .story-role{grid-template-columns:1fr;gap:2px 0}
  .story-role dd{margin-bottom:10px}
  .ac-legend{display:none}
  .ac{grid-template-columns:1fr;gap:8px;padding:14px 0}
  .ac-id{padding-top:0}
  .arrow::before{transform:rotate(135deg)}
  .beat::before{
    display:block;
    font-family:var(--mono);
    font-weight:600;
    color:var(--ink-3);
    margin-bottom:2px;
  }
  .beat.given::before{content:"前提"}
  .beat.when::before{content:"動作"}
  .beat.then::before{content:"結果";color:var(--brand)}
  .auth{display:none}
  .screen-body{padding:24px 16px}
  .diagram{padding:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="shell">

  <aside class="rail">

<script type="module">
import { renderMermaidSVG } from 'https://esm.sh/beautiful-mermaid@1'

// Mirrors the :root tokens. `accent` is the brand color: change it alongside
// --brand when rebranding.
const theme = {
  bg:'#FFFFFF',
  fg:'#15202C',
  line:'#BFCEDC',
  accent:'#337ECC',
  muted:'#63768A',
  surface:'#F4F7FA',
  border:'#DBE4ED',
}

// beautiful-mermaid has no font-size option, so scale the whole SVG to enlarge
// its text. Read the viewBox because width and height carry no units.
const SCALE = 1.4

document.querySelectorAll('pre.mermaid').forEach(pre => {
  const src = pre.textContent.trim()
  try {
    const holder = document.createElement('div')
    holder.innerHTML = renderMermaidSVG(src, theme)
    const svg = holder.querySelector('svg')
    if (svg) {
      const box = svg.getAttribute('viewBox')?.split(/[\s,]+/).map(Number)
      const w = box ? box[2] : parseFloat(svg.getAttribute('width'))
      const h = box ? box[3] : parseFloat(svg.getAttribute('height'))
      if (w && h) {
        svg.setAttribute('width', w * SCALE)
        svg.setAttribute('height', h * SCALE)
        svg.style.maxWidth = 'none'
      }
    }
    pre.replaceWith(holder)
  } catch (err) {
    // Fail loudly: an unsupported diagram type must not render as blank space.
    const box = document.createElement('div')
    box.className = 'msg bad'
    box.textContent = 'Mermaid render error: ' + err.message
    pre.replaceWith(box)
    console.error('[spec] mermaid:', err)
  }
})

// Drag a diagram box with the mouse to pan it.
document.querySelectorAll('.diagram').forEach(box => {
  let dragging = false, startX = 0, startY = 0, left = 0, top = 0
  box.addEventListener('pointerdown', e => {
    if (e.button !== 0) return
    dragging = true
    startX = e.clientX; startY = e.clientY
    left = box.scrollLeft; top = box.scrollTop
    box.setPointerCapture(e.pointerId)
    box.classList.add('dragging')
  })
  box.addEventListener('pointermove', e => {
    if (!dragging) return
    box.scrollLeft = left - (e.clientX - startX)
    box.scrollTop = top - (e.clientY - startY)
  })
  const stop = e => {
    if (!dragging) return
    dragging = false
    box.classList.remove('dragging')
    if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId)
  }
  box.addEventListener('pointerup', stop)
  box.addEventListener('pointercancel', stop)
})
</script>

<script type="module">
import { codeToHtml } from 'https://esm.sh/shiki@3'

// Pretty-print before highlighting, so a payload authored on one line still
// reads as indented code. Formatting failure keeps the source text as authored.
const TS_LANGS = new Set(['ts', 'tsx', 'js', 'jsx'])
let prettierPromise

async function loadPrettier() {
  prettierPromise ??= Promise.all([
    import('https://esm.sh/prettier@3/standalone'),
    import('https://esm.sh/prettier@3/plugins/estree'),
    import('https://esm.sh/prettier@3/plugins/typescript'),
  ])
  return prettierPromise
}

async function format(code, lang) {
  if (lang === 'json') {
    try {
      return JSON.stringify(JSON.parse(code), null, 2)
    } catch {
      return code
    }
  }
  if (!TS_LANGS.has(lang)) return code
  const [prettier, estree, typescript] = await loadPrettier()
  const opts = { parser: 'typescript', plugins: [estree.default ?? estree, typescript.default ?? typescript], tabWidth: 2, printWidth: 80, semi: true }
  try {
    return (await prettier.format(code, opts)).trimEnd()
  } catch {
    // A bare signature has no body, which is not valid on its own. Declare it,
    // format, then take the declaration wrapper back off.
    try {
      const wrapped = await prettier.format('declare ' + code.replace(/^export\s+/, ''), opts)
      const body = wrapped.trimEnd().replace(/^declare\s+/, '')
      return code.startsWith('export') ? 'export ' + body : body
    } catch {
      return code
    }
  }
}

const blocks = [...document.querySelectorAll('pre[data-lang]')]
await Promise.all(blocks.map(async pre => {
  const code = await format(pre.textContent.replace(/\n$/, ''), pre.dataset.lang)
  const html = await codeToHtml(code, { lang: pre.dataset.lang, theme: 'github-light' })
  const holder = document.createElement('div')
  holder.innerHTML = html
  const out = holder.firstElementChild
  Object.assign(out.style, {
    background: 'var(--sunken)',
    border: '1.5px solid var(--line)',
    borderRadius: '6px',
    padding: '18px 20px',
    overflowX: 'auto',
    fontSize: '16px',
    lineHeight: '1.7',
  })
  pre.replaceWith(out)
}))
</script>

<script>
// wireframe: screen tabs
document.querySelectorAll('[data-flow]').forEach(flow => {
  const screens = [...flow.querySelectorAll('[data-screen]')]
  if (!screens.length) return
  const nav = document.createElement('div')
  nav.className = 'wf-nav'
  screens.forEach(s => {
    const b = document.createElement('button')
    b.dataset.goto = s.dataset.screen
    b.textContent = s.dataset.screenTitle
    nav.append(b)
  })
  screens[0].before(nav)
  const activate = id => {
    screens.forEach(s => s.classList.toggle('on', s.dataset.screen === id))
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.goto === id))
  }
  flow.addEventListener('click', e => {
    const t = e.target.closest('[data-goto]')
    if (t) activate(t.dataset.goto)
  })
  const start = flow.dataset.start
  const startValid = screens.some(s => s.dataset.screen === start)
  if (start && !startValid) console.error('[spec] data-start matches no screen:', start)
  activate(startValid ? start : screens[0].dataset.screen)
})

// Flag every data-goto that points at a screen this flow does not have.
document.querySelectorAll('[data-goto]').forEach(trigger => {
  const flow = trigger.closest('[data-flow]')
  const target = flow && flow.querySelector('[data-screen="' + CSS.escape(trigger.dataset.goto) + '"]')
  if (!target) {
    trigger.classList.add('goto-unresolved')
    trigger.title = 'data-goto 指到不存在的畫面：' + trigger.dataset.goto
    console.error('[spec] unresolved data-goto:', trigger.dataset.goto)
  }
})

// wireframe: state chips
document.querySelectorAll('[data-screen]').forEach(screen => {
  const panels = [...screen.querySelectorAll('[data-state-panel]')]
  if (!panels.length) return
  const bar = document.createElement('div')
  bar.className = 'states'
  panels.forEach((panel, i) => {
    const b = document.createElement('button')
    b.textContent = panel.dataset.stateLabel
    b.addEventListener('click', () => {
      panels.forEach(p => p.classList.toggle('on', p === panel))
      bar.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b))
    })
    bar.append(b)
    if (i === 0) { panel.classList.add('on'); b.classList.add('on') }
  })
  panels[0].before(bar)
})

// toc highlight
const links = [...document.querySelectorAll('#toc a')]
const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]))
const sections = [...document.querySelectorAll('section[id]')]
const visible = new Set()
const io = new IntersectionObserver(entries => {
  entries.forEach(e => e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id))
  const current = sections.find(s => visible.has(s.id))
  links.forEach(a => a.classList.remove('on'))
  if (current) map.get(current.id)?.classList.add('on')
}, { rootMargin: '-10% 0px -70% 0px' })
sections.forEach(s => io.observe(s))
</script>
