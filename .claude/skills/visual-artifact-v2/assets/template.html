<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!-- ARTIFACT:DOCUMENT_TITLE complete browser title --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* OneAD visual language. Keep these values aligned with the Mermaid theme. */
        --brand: #337ecc;
        --brand-deep: #245a93;
        --brand-soft: #7faedd;
        --brand-bg: #e8f0fa;

        --paper: #f4f7fa;
        --surface: #ffffff;
        --sunken: #eef3f8;
        --ink: #15202c;
        --ink-2: #3e5266;
        --ink-3: #63768a;
        --line: #dbe4ed;
        --line-2: #bfcedc;

        --green: #33745a;
        --green-bg: #e6f1eb;
        --amber: #8a6524;
        --amber-bg: #f7f0e1;
        --red: #9e4a46;
        --red-bg: #f8eae9;

        --serif: 'Newsreader', 'Noto Serif TC', Georgia, serif;
        --sans: 'Inter', 'Noto Sans TC', -apple-system, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

        --rail: 188px;
        --gap: 52px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 32px;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 450;
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      code,
      pre,
      .mono {
        font-family: var(--mono);
      }
      strong {
        font-weight: 650;
      }

      /* ---------- shell ---------- */
      .shell {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 40px 140px;
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        gap: var(--gap);
        align-items: start;
      }

      /* ---------- left rail ---------- */
      .rail {
        position: sticky;
        top: 0;
        padding: 72px 0 0;
      }
      .rail-mark {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--brand-deep);
        padding-bottom: 16px;
        border-bottom: 2px solid var(--line-2);
        margin-bottom: 20px;
      }
      .rail-mark:empty {
        display: none;
      }
      .rail nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .rail nav a {
        text-decoration: none;
        color: var(--ink-2);
        font-size: 16px;
        font-weight: 500;
        padding: 7px 0 7px 16px;
        border-left: 3px solid transparent;
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .rail nav a:hover {
        color: var(--ink);
      }
      .rail nav a.on {
        color: var(--brand-deep);
        border-left-color: var(--brand);
        font-weight: 650;
      }
      .rail nav a:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
        border-radius: 3px;
      }
      .rail-foot {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: var(--mono);
        font-size: 16px;
        color: var(--ink-3);
      }
      .rail-foot:empty {
        display: none;
      }
      .rail-foot a {
        color: var(--brand-deep);
        text-decoration: none;
        font-weight: 500;
      }
      .rail-foot a:hover {
        text-decoration: underline;
      }

      /* ---------- masthead ---------- */
      .masthead {
        padding: 72px 0 0;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand);
      }
      .eyebrow:empty {
        display: none;
      }
      .masthead h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(42px, 6vw, 64px);
        line-height: 1.1;
        letter-spacing: -0.015em;
        margin: 16px 0 0;
      }
      .lede {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 500;
        line-height: 1.65;
        color: var(--ink-2);
        max-width: 42em;
        margin: 20px 0 0;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
      }
      .tags:empty {
        display: none;
      }
      .tag {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 500;
        padding: 4px 14px;
        border: 1.5px solid var(--line-2);
        border-radius: 999px;
        color: var(--ink-2);
      }
      .tag.draft {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      a.tag {
        text-decoration: none;
        color: var(--brand-deep);
        border-color: var(--brand-soft);
      }
      a.tag:hover {
        background: var(--brand-bg);
      }

      /* ---------- sections ---------- */
      section {
        padding-top: 92px;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 2px solid var(--line-2);
        margin-bottom: 36px;
      }
      .sec-head h2 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .sec-head .eyebrow {
        margin-left: auto;
        color: var(--ink-3);
      }
      h3 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 23px;
        margin: 52px 0 16px;
      }
      h4 {
        font-family: var(--mono);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        font-weight: 600;
        margin: 26px 0 12px;
      }
      p {
        margin: 0 0 16px;
      }
      .muted {
        color: var(--ink-2);
      }

      /* ---------- note ---------- */
      .note {
        display: flex;
        gap: 16px;
        padding: 18px 22px;
        border-radius: 6px;
        background: var(--brand-bg);
        border-left: 4px solid var(--brand);
        line-height: 1.75;
        color: var(--ink-2);
        margin: 30px 0;
      }
      .note p {
        margin: 0;
      }
      .note .label {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--brand-deep);
        flex: 0 0 auto;
      }
      .note.proposal,
      .note.proposed {
        background: var(--amber-bg);
        border-left-color: var(--amber);
      }
      .note.proposal .label,
      .note.proposed .label {
        color: var(--amber);
      }
      .note + .note {
        margin-top: 16px;
      }
      .note.verified {
        background: var(--green-bg);
        border-left-color: var(--green);
      }
      .note.verified .label {
        color: var(--green);
      }
      .note.assumption {
        background: var(--brand-bg);
        border-left-color: var(--brand);
      }
      .note.assumption .label {
        color: var(--brand-deep);
      }
      .note.unknown {
        background: var(--red-bg);
        border-left-color: var(--red);
      }
      .note.unknown .label {
        color: var(--red);
      }
      .evidence-meta {
        margin-top: 8px !important;
        font-family: var(--mono);
        font-size: 15px;
        color: var(--ink-3);
      }

      /* ---------- goals ---------- */
      .split {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 36px;
      }
      .panel {
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 22px;
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .panel-head .sign {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 17px;
        line-height: 1;
      }
      .panel.goals .panel-head {
        background: var(--brand);
        color: #fff;
      }
      .panel.goals .sign {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .panel.nongoals .panel-head {
        background: var(--ink-2);
        color: #fff;
      }
      .panel.nongoals .sign {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .panel ul {
        margin: 0;
        padding: 6px 22px 18px;
        list-style: none;
        max-width: none;
      }
      .panel li {
        position: relative;
        padding: 12px 0 12px 24px;
        border-bottom: 1px solid var(--line);
        line-height: 1.7;
      }
      .panel li:last-child {
        border-bottom: 0;
      }
      .panel li::before {
        position: absolute;
        left: 0;
        top: 12px;
        font-family: var(--mono);
        font-weight: 700;
      }
      .panel.goals li::before {
        content: '✓';
        color: var(--brand);
      }
      .panel.nongoals li::before {
        content: '✕';
        color: var(--ink-3);
      }
      .panel.nongoals li {
        color: var(--ink-2);
      }

      /* ---------- comparison ---------- */
      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .comparison-item {
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 22px;
      }
      .comparison-head {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        padding-bottom: 10px;
        border-bottom: 2px solid var(--line);
      }
      .comparison-item.after {
        border-color: var(--brand-soft);
      }
      .comparison-item.after .comparison-head {
        color: var(--brand-deep);
        border-color: var(--brand-soft);
      }
      .comparison-item h3 {
        font-size: 21px;
        margin: 20px 0 10px;
      }
      .comparison-item p:last-child {
        margin-bottom: 0;
      }

      /* ---------- timeline ---------- */
      .timeline {
        list-style: none;
        margin: 20px 0 0;
        padding: 0;
      }
      .timeline li {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 18px;
        position: relative;
        padding: 0 0 28px;
      }
      .timeline li:not(:last-child)::before {
        content: '';
        position: absolute;
        left: 26px;
        top: 46px;
        bottom: 0;
        width: 2px;
        background: var(--line-2);
      }
      .timeline-step {
        width: 54px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--brand-soft);
        border-radius: 6px;
        background: var(--surface);
        color: var(--brand-deep);
        font-family: var(--mono);
        font-weight: 700;
      }
      .timeline h3 {
        font-size: 21px;
        margin: 2px 0 6px;
      }
      .timeline p {
        margin: 0;
        color: var(--ink-2);
      }

      /* ---------- summaries ---------- */
      .decision-matrix .recommended td {
        background: var(--brand-bg);
      }
      .decision-matrix .recommended td:first-child {
        color: var(--brand-deep);
      }

      /* ---------- rule matrix ---------- */
      .rule-matrix table {
        width: 100%;
        border-collapse: collapse;
      }
      .rule-matrix th,
      .rule-matrix td {
        text-align: left;
        vertical-align: top;
        padding: 12px 14px;
        border: 1px solid var(--line);
        font-size: 15px;
        line-height: 1.55;
      }
      .rule-matrix thead th {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: none;
        color: var(--ink-3);
        background: var(--sunken);
        border-bottom-color: var(--line-2);
        white-space: nowrap;
      }
      .rule-matrix tbody th {
        font-weight: 500;
        color: var(--ink);
        background: var(--surface);
        width: 32%;
      }
      .rule-matrix .allow {
        color: var(--ink-3);
      }
      .rule-matrix .hold {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .rule-matrix .deny {
        background: var(--sunken);
        color: var(--ink-3);
      }
      .rule-matrix .cell-ac {
        display: block;
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        color: var(--brand-deep);
      }
      .rule-matrix .hold .cell-ac {
        color: var(--amber);
      }
      .rule-matrix .deny .cell-ac {
        color: var(--ink-3);
      }
      .rule-matrix td[data-ac] {
        cursor: pointer;
        transition: box-shadow 0.16s;
      }
      .rule-matrix td[data-ac]:hover {
        box-shadow: inset 0 0 0 2px var(--brand-soft);
      }
      .rule-matrix td[data-ac].is-lit {
        box-shadow: inset 0 0 0 2px var(--brand);
      }
      .rule-matrix td[data-ac]:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: -2px;
      }
      .matrix-notes {
        margin: 14px 0 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .matrix-notes .note-line {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 0 18px;
        align-items: start;
        padding: 8px 10px;
        margin: 0 -10px;
        border-radius: 5px;
        color: var(--ink-2);
        cursor: pointer;
        transition: background 0.16s;
      }
      .matrix-notes .note-line:hover {
        background: var(--sunken);
      }
      .matrix-notes .note-line.is-lit {
        background: var(--brand-bg);
        box-shadow: inset 3px 0 0 var(--brand);
      }
      .matrix-notes .note-line:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: -2px;
      }
      .story .rule-matrix {
        padding: 0 24px;
      }
      .story .matrix-notes {
        padding: 0 24px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.4;
        padding: 2px 9px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .status.ok {
        color: var(--green);
        background: var(--green-bg);
      }
      .status.warn {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .status.bad {
        color: var(--red);
        background: var(--red-bg);
      }
      .status.info {
        color: var(--brand-deep);
        background: var(--brand-bg);
      }
      .status.muted-status {
        color: var(--ink-3);
        background: var(--sunken);
      }
      .status-item {
        display: grid;
        grid-template-columns: 88px 180px minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        padding: 16px 8px;
        border-bottom: 1px solid var(--line);
      }
      .status-item p {
        margin: 0;
        color: var(--ink-2);
        max-width: none;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        margin-top: 20px;
      }
      .metric {
        display: flex;
        flex-direction: column;
        padding: 22px;
        border-right: 1px solid var(--line);
      }
      .metric:last-child {
        border-right: 0;
      }
      .metric-value {
        font-family: var(--serif);
        font-size: 36px;
        line-height: 1.2;
        color: var(--brand-deep);
      }
      .metric-label {
        font-weight: 650;
        margin-top: 5px;
      }
      .metric-detail {
        font-family: var(--mono);
        font-size: 15px;
        color: var(--ink-3);
        margin-top: 3px;
      }

      /* ---------- user stories ---------- */
      .stories {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .story {
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .story-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 24px;
        background: var(--sunken);
        border-bottom: 1.5px solid var(--line);
      }
      .story-id {
        font-family: var(--mono);
        font-weight: 700;
        color: #fff;
        background: var(--brand);
        border-radius: 5px;
        padding: 2px 11px;
      }
      .story-title {
        font-family: var(--serif);
        font-size: 21px;
        font-weight: 600;
        margin: 0;
      }
      .story-count {
        margin-left: auto;
        font-family: var(--mono);
        color: var(--ink-3);
        white-space: nowrap;
      }
      .story-lede {
        margin: 0;
        padding: 18px 24px;
        line-height: 1.75;
        color: var(--ink-2);
        border-bottom: 1.5px solid var(--line);
      }
      .story-lede b {
        font-weight: 600;
        color: var(--ink);
      }

      .story .diagram {
        margin: 0;
        border: 0;
        border-radius: 0;
        border-bottom: 1.5px solid var(--line);
      }
      .ac-grid {
        padding: 0 24px 22px;
      }
      .ac-grid .ac-head,
      .ac-grid .ac {
        display: grid;
        grid-template-columns: 72px minmax(0, 0.95fr) minmax(0, 0.75fr) minmax(0, 1.4fr);
        gap: 0 18px;
        align-items: start;
      }
      .ac-head {
        padding: 14px 10px 10px;
        margin: 0 -10px;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--ink-3);
        border-bottom: 1.5px solid var(--line-2);
      }
      .ac-head .then {
        color: var(--brand);
      }
      .ac-grid .ac {
        padding: 13px 10px;
        margin: 0 -10px;
        border-top: 1px solid var(--line);
        border-radius: 5px;
        scroll-margin-top: 24px;
        transition:
          background 0.16s,
          box-shadow 0.16s;
      }
      .ac-grid .ac-head + .ac {
        border-top: 0;
      }
      .ac-grid .ac.is-linked {
        cursor: pointer;
      }
      .ac-grid .ac.is-linked:hover {
        background: var(--sunken);
      }
      .ac-grid .ac.is-lit {
        background: var(--brand-bg);
        box-shadow: inset 3px 0 0 var(--brand);
      }
      .ac-grid .ac:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: -2px;
      }
      .ac-id {
        font-family: var(--mono);
        font-size: 14px;
        color: var(--brand-deep);
        background: var(--brand-bg);
        border-radius: 5px;
        padding: 2px 7px;
        width: fit-content;
        font-weight: 700;
      }
      .beat {
        font-size: 15px;
        line-height: 1.6;
      }
      .beat.given {
        color: var(--ink-2);
      }
      .beat.when {
        color: var(--ink);
        font-weight: 500;
      }
      .beat.then {
        color: var(--brand-deep);
        font-weight: 500;
      }
      .beat::before {
        display: none;
        width: 3.6em;
        margin-right: 10px;
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-3);
      }
      .beat.given::before { content: '前提'; }
      .beat.when::before { content: '動作'; }
      .beat.then::before { content: '預期'; color: var(--brand); }

      /* Diagram focus: every edge keeps its own colour, the unrelated ones step back. */
      .diagram svg polyline.edge,
      .diagram svg text.ac-lbl {
        transition: opacity 0.16s;
      }
      .diagram svg text.ac-lbl {
        cursor: pointer;
      }
      .diagram svg.is-lit polyline.edge:not(.is-lit) {
        opacity: 0.14;
      }
      .diagram svg.is-lit text.ac-lbl:not(.is-lit) {
        opacity: 0.2;
      }

      /* ---------- inline code ---------- */
      p code,
      li code,
      td code,
      summary code,
      .msg code {
        font-size: 0.92em;
        font-weight: 500;
        background: var(--sunken);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--brand-deep);
      }

      /* ---------- tables ---------- */
      .tw {
        overflow-x: auto;
        margin: 8px 0 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 16px;
      }
      th {
        text-align: left;
        font-family: var(--mono);
        font-size: 16px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ink-3);
        padding: 0 18px 12px 0;
        border-bottom: 2px solid var(--line-2);
        white-space: nowrap;
      }
      td {
        padding: 14px 18px 14px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        line-height: 1.7;
        color: var(--ink-2);
      }
      td:first-child {
        color: var(--ink);

      /* ---------- diagram ---------- */
      .diagram {
        margin-top: 16px;
        padding: 24px;
        max-height: 85dvh;
        display: flex;
        /* "safe" falls back to start-alignment instead of centering when centering
           would push part of an oversized child out of scroll range. */
        justify-content: safe center;
        align-items: safe center;
        overflow: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 8px;
      }
      .diagram::-webkit-scrollbar {
        display: none;
      }
      .diagram.scrollable {
        cursor: grab;
        touch-action: none;
      }
      .diagram.scrollable.dragging {
        cursor: grabbing;
        user-select: none;
      }
      .diagram svg {
        display: block;
        flex-shrink: 0;
      }
      .diagram-cap {
        font-size: 16px;
        color: var(--ink-3);
        margin: 10px 0 0;
      }
      .story .diagram-cap {
        padding: 0 24px;
        margin: 12px 0 16px;
      }

      /* ---------- API ledger ---------- */
      .ledger {
        border-top: 2px solid var(--line-2);
      }
      .group-label {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand-deep);
        padding: 30px 0 10px;

      }
      .ledger summary {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr) auto 16px;

        transition: background 0.18s;

      .ledger summary::-webkit-details-marker {
        display: none;
      }
      .ledger summary:hover {
        background: var(--sunken);
      }
      .ledger summary:focus-visible {
        outline: 2px solid var(--brand);

        letter-spacing: 0.04em;

        padding: 2px 0;

      .verb.get {

      .path {
        font-family: var(--mono);

      /* ---------- responsive ---------- */

    <div class="shell">
      <aside class="rail">
        <div class="rail-mark">
          <!-- ARTIFACT:PRODUCT optional product or system name, remove comment when empty -->
        </div>
        <nav id="toc"></nav>

          <!-- ARTIFACT:RAIL_META optional date and source link, remove comment when empty -->

      <main>

          <div class="eyebrow">
            <!-- ARTIFACT:EYEBROW optional artifact type or phase, remove comment when empty -->
          </div>
          <h1><!-- ARTIFACT:TITLE required literal subject name --></h1>
          <p class="lede"><!-- ARTIFACT:SUMMARY required one-sentence explanation --></p>
          <div class="tags">
            <!-- ARTIFACT:TAGS optional status, date, source, and topic tags, remove comment when empty -->

        <!-- ARTIFACT:SECTIONS one or more section[data-title] blocks from references/components.md -->
      </main>

    <script type="module">
      import { renderMermaidSVG } from 'https://esm.sh/beautiful-mermaid@1'

      const theme = {
        bg: '#FFFFFF',
        fg: '#15202C',
        line: '#BFCEDC',
        accent: '#337ECC',
        muted: '#63768A',
        surface: '#F4F7FA',
        border: '#DBE4ED',
      }

      // beautiful-mermaid has no font-size option, so scale the whole SVG to enlarge
      // its text. Read the viewBox because width and height carry no units.
      const SCALE = 1.4

      document.querySelectorAll('pre.mermaid').forEach((pre) => {
        const src = pre.textContent.trim()
        const container = pre.closest('.diagram')
        try {
          const holder = document.createElement('div')
          holder.innerHTML = renderMermaidSVG(src, theme)
          const svg = holder.querySelector('svg')
          if (svg) {
            const box = svg
              .getAttribute('viewBox')
              ?.split(/[\s,]+/)
              .map(Number)
            const w = box ? box[2] : parseFloat(svg.getAttribute('width'))
            const h = box ? box[3] : parseFloat(svg.getAttribute('height'))
            if (w && h) {
              svg.setAttribute('width', w * SCALE)
              svg.setAttribute('height', h * SCALE)
              svg.style.width = `${w * SCALE}px`
              svg.style.height = `${h * SCALE}px`
            }
            pre.replaceWith(svg)
          } else {
            pre.replaceWith(holder)
          }
          // Oversized diagrams scroll instead of shrinking. Mark only the ones
          // that overflow so a diagram that already fits shows no grab affordance.
          if (
            container &&
            (container.scrollWidth > container.clientWidth + 1 ||
              container.scrollHeight > container.clientHeight + 1)
          ) {
            container.classList.add('scrollable')
          }
        } catch (err) {
          const box = document.createElement('div')
          box.className = 'msg bad'
          box.textContent = 'Mermaid render error: ' + err.message
          pre.replaceWith(box)
          console.error('[artifact] mermaid:', err)
        }
      })

      // ---- link each story picture to its acceptance-criteria list ----
      // The picture is a diagram whose edges carry data-label="AC-NN", a rule
      // matrix whose cells carry data-ac, or both. Lighting one side lights the
      // other, so the reader never matches ids by hand. One AC can own several
      // edges or cells.
      document.querySelectorAll('.story').forEach((story) => {
        const grid = story.querySelector('.ac-grid')
        if (!grid) return
        const svg = story.querySelector('.diagram svg')
        const holder = story.querySelector('.diagram')

        const marks = new Map() // AC id -> every element it lights
        const add = (id, el) => {
          if (!marks.has(id)) marks.set(id, [])
          marks.get(id).push(el)
        }

        const edgeIds = new Set()
        if (svg) {
          svg.querySelectorAll('polyline.edge').forEach((edge) => {
            const id = edge.getAttribute('data-label')
            if (!id) return
            edgeIds.add(id)
            add(id, edge)
          })
          svg.querySelectorAll('text').forEach((text) => {
            const id = text.textContent.trim()
            if (!edgeIds.has(id)) return
            text.classList.add('ac-lbl')
            text.dataset.ac = id
            add(id, text)
          })
        }
        const cells = story.querySelectorAll('.rule-matrix [data-ac], .matrix-notes [data-ac]')
        cells.forEach((cell) => add(cell.dataset.ac, cell))

        let lit = null

        function light(id, scroll) {
          if (lit === id) id = null // clicking the lit one clears it
          lit = id
          const hasEdge = Boolean(id) && edgeIds.has(id)
          if (svg) svg.classList.toggle('is-lit', hasEdge)
          marks.forEach((els, key) => {
            els.forEach((el) => el.classList.toggle('is-lit', key === id))
          })
          grid.querySelectorAll('.ac').forEach((row) => {
            row.classList.toggle('is-lit', row.dataset.ac === id)
          })
          if (!hasEdge || !scroll || !holder) return
          if (holder.scrollWidth <= holder.clientWidth) return
          const label = marks.get(id).find((el) => el.classList.contains('ac-lbl'))
          if (!label) return
          const factor = svg.clientWidth / svg.viewBox.baseVal.width || 1
          const x = label.getBBox().x * factor
          holder.scrollTo({ left: x - holder.clientWidth / 2, behavior: 'smooth' })
        }

        grid.querySelectorAll('.ac').forEach((row) => {
          if (!marks.has(row.dataset.ac)) return // a row with no partner stays plain text
          row.classList.add('is-linked')
          row.tabIndex = 0
          row.addEventListener('click', () => light(row.dataset.ac, true))
          row.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return
            e.preventDefault()
            light(row.dataset.ac, true)
          })
        })

        function fromPicture(id) {
          if (!id) return
          light(id, false)
          const row = grid.querySelector(`.ac[data-ac="${id}"]`)
          if (lit && row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
        }

        if (svg) svg.addEventListener('click', (e) => fromPicture(e.target.dataset?.ac))
        cells.forEach((cell) => {
          cell.tabIndex = 0
          cell.addEventListener('click', () => fromPicture(cell.dataset.ac))
          cell.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return
            e.preventDefault()
            fromPicture(cell.dataset.ac)
          })
        })
      })
    </script>

    <script type="module">
      import {
        DIFFS_TAG_NAME,
        FileDiff,
        parseDiffFromFile,
        parsePatchFiles,
      } from 'https://esm.sh/@pierre/diffs@1'

      const diffInstances = []

      function diffSource(node) {
        return node?.textContent.replace(/\n$/, '') ?? ''
      }

      function renderFileDiff(view, host, fileDiff) {
        const fileContainer = document.createElement(DIFFS_TAG_NAME)
        host.append(fileContainer)
        const instance = new FileDiff({
          diffStyle: view.dataset.diffStyle === 'unified' ? 'unified' : 'split',
          overflow: 'scroll',
          theme: 'pierre-light',
        })
        instance.render({ fileContainer, fileDiff })
        diffInstances.push(instance)
      }

      document.querySelectorAll('[data-diff]').forEach((view, index) => {
        const host = view.querySelector('[data-diff-host]')
        try {
          if (!host) throw new Error('Missing data-diff-host')
          const patch = view.querySelector('[data-diff-patch]')
          let fileDiffs
          if (patch) {
            fileDiffs = parsePatchFiles(diffSource(patch), `artifact-patch-${index}`).flatMap(
              (parsed) => parsed.files,
            )
          } else {
            const before = view.querySelector('[data-diff-before]')
            const after = view.querySelector('[data-diff-after]')
            const name = view.dataset.fileName
            if (!before || !after || !name) throw new Error('Incomplete before/after diff source')
            fileDiffs = [
              parseDiffFromFile(
                { name, contents: diffSource(before), cacheKey: `artifact-before-${index}` },
                { name, contents: diffSource(after), cacheKey: `artifact-after-${index}` },
              ),
            ]
          }
          if (!fileDiffs.length) throw new Error('Diff source produced no files')
          fileDiffs.forEach((fileDiff) => renderFileDiff(view, host, fileDiff))
          view.classList.add('is-rendered')
          view.dataset.diffRendered = 'true'
        } catch (err) {
          view.classList.add('is-error')
          view.dataset.diffError = err.message
          const box = document.createElement('div')
          box.className = 'msg bad'
          box.textContent = 'Diff render error: ' + err.message
          view.prepend(box)
          console.error('[artifact] diff:', err)
        }
      })

      addEventListener('pagehide', () => {
        diffInstances.forEach((instance) => instance.cleanUp())
      })
    </script>

    <script type="module">
      import { codeToHtml } from 'https://esm.sh/shiki@3'

      const TS_LANGS = new Set(['ts', 'tsx', 'js', 'jsx'])
      let prettierPromise

      async function loadPrettier() {
        prettierPromise ??= Promise.all([
          import('https://esm.sh/prettier@3/standalone'),
          import('https://esm.sh/prettier@3/plugins/estree'),
          import('https://esm.sh/prettier@3/plugins/typescript'),
        ])
        return prettierPromise
      }

      async function format(code, lang) {
        if (lang === 'json') {
          try {
            return JSON.stringify(JSON.parse(code), null, 2)
          } catch {
            return code
          }
        }
        if (!TS_LANGS.has(lang)) return code
        const [prettier, estree, typescript] = await loadPrettier()
        const opts = {
          parser: 'typescript',
          plugins: [estree.default ?? estree, typescript.default ?? typescript],
          tabWidth: 2,
          printWidth: 80,
          semi: true,
        }
        try {
          return (await prettier.format(code, opts)).trimEnd()
        } catch {
          // A bare signature has no body, which is not valid on its own. Declare it,
          // format, then take the declaration wrapper back off.
          try {
            const wrapped = await prettier.format('declare ' + code.replace(/^export\s+/, ''), opts)
            const body = wrapped.trimEnd().replace(/^declare\s+/, '')
            return code.startsWith('export') ? 'export ' + body : body
          } catch {
            return code
          }
        }
      }

      const blocks = [...document.querySelectorAll('pre[data-lang]:not([data-diff-source])')]
      await Promise.all(
        blocks.map(async (pre) => {
          const code = await format(pre.textContent.replace(/\n$/, ''), pre.dataset.lang)
          const html = await codeToHtml(code, { lang: pre.dataset.lang, theme: 'github-light' })
          const holder = document.createElement('div')
          holder.innerHTML = html
          const out = holder.firstElementChild
          Object.assign(out.style, {
            background: 'var(--sunken)',
            border: '1.5px solid var(--line)',
            borderRadius: '6px',
            padding: '18px 20px',
            overflowX: 'auto',
            fontSize: '16px',
            lineHeight: '1.7',
          })
          pre.replaceWith(out)
        }),
      )
    </script>

    <script>
      // diagram: drag-to-scroll for a Mermaid diagram larger than its container
      let diagramDrag = null
      document.addEventListener('pointerdown', (e) => {
        const container = e.target.closest('.diagram.scrollable')
        if (!container || e.button !== 0) return
        diagramDrag = {
          container,
          startX: e.clientX,
          startY: e.clientY,
          startScrollLeft: container.scrollLeft,
          startScrollTop: container.scrollTop,
        }
        container.classList.add('dragging')
        container.setPointerCapture(e.pointerId)
        e.preventDefault()
      })
      document.addEventListener('pointermove', (e) => {
        if (!diagramDrag) return
        diagramDrag.container.scrollLeft = diagramDrag.startScrollLeft - (e.clientX - diagramDrag.startX)
        diagramDrag.container.scrollTop = diagramDrag.startScrollTop - (e.clientY - diagramDrag.startY)
      })
      ;['pointerup', 'pointercancel'].forEach((type) =>
        document.addEventListener(type, () => {
          if (!diagramDrag) return
          diagramDrag.container.classList.remove('dragging')
          diagramDrag = null
        }),
      )

      // wireframe: screen tabs
      document.querySelectorAll('[data-flow]').forEach((flow) => {
        const screens = [...flow.querySelectorAll('[data-screen]')]
        if (!screens.length) return
        const nav = document.createElement('div')
        nav.className = 'wf-nav'
        screens.forEach((s) => {
          const b = document.createElement('button')
          b.dataset.goto = s.dataset.screen
          b.textContent = s.dataset.screenTitle
          nav.append(b)
        })
        screens[0].before(nav)
        const activate = (id) => {
          screens.forEach((s) => s.classList.toggle('on', s.dataset.screen === id))
          nav
            .querySelectorAll('button')
            .forEach((b) => b.classList.toggle('on', b.dataset.goto === id))
        }
        flow.addEventListener('click', (e) => {
          const t = e.target.closest('[data-goto]')
          if (t) activate(t.dataset.goto)
        })
        const start = flow.dataset.start
        const startValid = screens.some((s) => s.dataset.screen === start)
        if (start && !startValid) console.error('[artifact] data-start matches no screen:', start)
        activate(startValid ? start : screens[0].dataset.screen)
      })

      document.querySelectorAll('[data-goto]').forEach((trigger) => {
        const flow = trigger.closest('[data-flow]')
        const target =
          flow && flow.querySelector('[data-screen="' + CSS.escape(trigger.dataset.goto) + '"]')
        if (!target) {
          trigger.classList.add('goto-unresolved')
          trigger.title = 'data-goto 指到不存在的畫面：' + trigger.dataset.goto
          console.error('[artifact] unresolved data-goto:', trigger.dataset.goto)
        }
      })

      // wireframe: state chips
      document.querySelectorAll('[data-screen]').forEach((screen) => {
        const panels = [...screen.querySelectorAll('[data-state-panel]')]
        if (!panels.length) return
        const bar = document.createElement('div')
        bar.className = 'states'
        panels.forEach((panel, i) => {
          const b = document.createElement('button')
          b.textContent = panel.dataset.stateLabel
          b.addEventListener('click', () => {
            panels.forEach((p) => p.classList.toggle('on', p === panel))
            bar.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b))
          })
          bar.append(b)
          if (i === 0) {
            panel.classList.add('on')
            b.classList.add('on')
          }
        })
        panels[0].before(bar)
      })

      const sections = [...document.querySelectorAll('section[id]')]
      const toc = document.querySelector('#toc')
      sections.forEach((section) => {
        const link = document.createElement('a')
        link.href = '#' + section.id
        link.textContent =
          section.dataset.title || section.querySelector('h2')?.textContent || section.id
        toc.append(link)
      })
      const links = [...toc.querySelectorAll('a')]
      const map = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]))
      const visible = new Set()
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) =>
            e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id),
          )
          const current = sections.find((s) => visible.has(s.id))
          links.forEach((a) => a.classList.remove('on'))
          if (current) map.get(current.id)?.classList.add('on')
        },
        { rootMargin: '-10% 0px -70% 0px' },
      )
      sections.forEach((s) => io.observe(s))
    </script>
  </body>
</html>
